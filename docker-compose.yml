name: vtab-sales-intelligence
x-backend-env: &backend-env
  APP_ENV: development
  DATABASE_URL: postgresql+psycopg://vtab:${POSTGRES_PASSWORD:?Run scripts/configure-demo.py first}@postgres:5432/vtab
  REDIS_URL: redis://redis:6379/0
  INITIALIZE_SCHEMA: "false"
  SCHEDULER_ENABLED: "false"
  DEMO_MODE: "true"
  DEMO_AUTH: "true"
  DEMO_OTP: "123456"
  LOGIN_EMAIL: ${LOGIN_EMAIL:-demo@vtabsquare.local}
  LOGIN_PASSWORD: ${LOGIN_PASSWORD:?Run scripts/configure-demo.py first}
  JWT_SECRET: ${JWT_SECRET:?Run scripts/configure-demo.py first}
  AI_PROVIDER: local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vtab
      POSTGRES_USER: vtab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure-demo.py first}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U vtab -d vtab"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    environment: *backend-env
    command: [sh, -c, "alembic upgrade head && python -m app.seed"]
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    build: ./backend
    environment: *backend-env
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    build: ./backend
    environment: *backend-env
    command: [python, -m, app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:8001
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
