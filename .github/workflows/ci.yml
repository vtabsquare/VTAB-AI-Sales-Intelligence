name: Phase 1 validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r backend/requirements.txt ruff
      - run: ruff check backend --select E9,F63,F7,F82
      - run: cd backend && python -m pytest tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit && npm run build
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/configure-demo.py
      - run: docker compose config --quiet && docker compose build
      - run: docker compose up -d --wait backend frontend worker
      - run: curl --fail http://localhost:8001/api/health && curl --fail http://localhost:3000/login
      - if: always()
        run: docker compose logs --no-color && docker compose down
